name: hifimate-music-assistant

services:
  server:
    image: ${MUSIC_ASSISTANT_IMAGE:-ghcr.io/neqq3/ma-custom-loader-amd64:2.10.9}
    container_name: ${MUSIC_ASSISTANT_CONTAINER_NAME:-hifimate-music-assistant}
    restart: unless-stopped
    # The official MPD provider reaches the host's loopback-only MPD on :6601.
    network_mode: host
    # Use the image's stock entrypoint and default /data and /data/.cache paths.
    user: "${MUSIC_ASSISTANT_UID:?set by the installer in .env}:${MUSIC_ASSISTANT_GID:?set by the installer in .env}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - type: bind
        source: ${MUSIC_ASSISTANT_DATA_DIR:-./data}
        target: /data
      - type: bind
        source: ./custom-loader-run.sh
        target: /run.sh
        read_only: true
      # The custom-loader image copies providers from this directory before
      # starting Music Assistant as MUSIC_ASSISTANT_UID/GID.
      - type: bind
        source: ${MUSIC_ASSISTANT_CUSTOM_PROVIDERS_DIR:-./custom_providers}
        target: /share/music_assistant/custom_providers
      - type: bind
        source: ${MUSIC_LIBRARY_DIR:?set by the installer in .env}
        target: /media
        read_only: true
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
        bind:
          create_host_path: false
    environment:
      LOG_LEVEL: ${MUSIC_ASSISTANT_LOG_LEVEL:-info}
      MUSIC_ASSISTANT_UID: ${MUSIC_ASSISTANT_UID:?set by the installer in .env}
      MUSIC_ASSISTANT_GID: ${MUSIC_ASSISTANT_GID:?set by the installer in .env}
      TZ: ${MUSIC_ASSISTANT_TZ:-}
    healthcheck:
      test:
        - CMD
        - /app/venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8095/', timeout=4).close()"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Keep the MA server on host networking for loopback MPD. This small host-network
  # proxy publishes the Web UI and can also reach the loopback spectrum proxy.
  web:
    image: ${MUSIC_ASSISTANT_WEB_IMAGE:-nginx:1.27-alpine}
    container_name: ${MUSIC_ASSISTANT_WEB_CONTAINER_NAME:-hifimate-music-assistant-web}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    # Host networking lets this proxy reach the loopback-only spectrum
    # (5008) and /ctrl (5009) servers without exposing them on the LAN.
    network_mode: host
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    volumes:
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/conf.d/default.conf.template
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./nginx-entrypoint.sh
        target: /opt/hifimate/nginx-entrypoint.sh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
        bind:
          create_host_path: false
      # Only the server pair; the CA key stays in ../config/tls on the host.
      - type: bind
        source: ../config/tls/nginx
        target: /etc/hifimate-tls
        read_only: true
        bind:
          create_host_path: false
    entrypoint: ["/bin/sh", "/opt/hifimate/nginx-entrypoint.sh"]
    environment:
      MUSIC_ASSISTANT_HTTP_BIND: ${MUSIC_ASSISTANT_HTTP_BIND:-0.0.0.0}
      MUSIC_ASSISTANT_HTTP_PORT: ${MUSIC_ASSISTANT_HTTP_PORT:-80}
      MUSIC_ASSISTANT_HTTPS_PORT: ${MUSIC_ASSISTANT_HTTPS_PORT:-443}
      TZ: ${MUSIC_ASSISTANT_TZ:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Downloads the explicitly configured third-party provider repositories.
  # Run with the same UID/GID as MA so options, state, and provider files have
  # one consistent owner and no root-owned runtime artifacts are created.
  provider-subscriber:
    image: ${MUSIC_ASSISTANT_PROVIDER_SUBSCRIBER_IMAGE:-ghcr.io/neqq3/ma-provider-subscriber-amd64:0.2.0}
    container_name: ${MUSIC_ASSISTANT_PROVIDER_SUBSCRIBER_CONTAINER_NAME:-hifimate-ma-provider-subscriber}
    restart: unless-stopped
    user: "${MUSIC_ASSISTANT_UID:?set by the installer in .env}:${MUSIC_ASSISTANT_GID:?set by the installer in .env}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - type: bind
        source: ${MUSIC_ASSISTANT_PROVIDER_SUBSCRIBER_CONFIG_DIR:-./provider-subscriber}
        target: /config
      - type: bind
        source: ${MUSIC_ASSISTANT_CUSTOM_PROVIDERS_DIR:-./custom_providers}
        target: /share/music_assistant/custom_providers
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
        bind:
          create_host_path: false
    environment:
      SUBSCRIBER_CONFIG_PATH: /config/options.json
      SUBSCRIBER_STATE_PATH: /config/state.json
      SUBSCRIBER_TARGET_DIR: /share/music_assistant/custom_providers
      TZ: ${MUSIC_ASSISTANT_TZ:-}

  ncm-api:
    image: ${MUSIC_ASSISTANT_NCM_API_IMAGE:-moefurina/ncm-api:latest}
    container_name: ${MUSIC_ASSISTANT_NCM_API_CONTAINER_NAME:-hifimate-ncm-api}
    restart: unless-stopped
    user: "${MUSIC_ASSISTANT_UID:?set by the installer in .env}:${MUSIC_ASSISTANT_GID:?set by the installer in .env}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${MUSIC_ASSISTANT_NCM_API_BIND:-127.0.0.1}:${MUSIC_ASSISTANT_NCM_API_PORT:-3003}:3000"
    environment:
      TZ: ${MUSIC_ASSISTANT_TZ:-}
    volumes:
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  # migu-api-enhanced (Migu Music API, routes under /migu) for the migu MA
  # provider. Upstream publishes no image, so Compose builds it from a pinned
  # commit; when overriding the source in .env, also change the image tag.
  # It sees the login token (it logs request URLs), so it stays on loopback.
  migu-api:
    image: ${MUSIC_ASSISTANT_MIGU_API_IMAGE:-hifimate-migu-api:87a4c2ffd2e3}
    build:
      context: ${MUSIC_ASSISTANT_MIGU_API_SOURCE:-https://github.com/Domdkw/miguMusic-api-enhanced.git#87a4c2ffd2e35a878d2d60894893e35a00074afb}
    container_name: ${MUSIC_ASSISTANT_MIGU_API_CONTAINER_NAME:-hifimate-migu-api}
    restart: unless-stopped
    user: "${MUSIC_ASSISTANT_UID:?set by the installer in .env}:${MUSIC_ASSISTANT_GID:?set by the installer in .env}"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${MUSIC_ASSISTANT_MIGU_API_BIND:-127.0.0.1}:${MUSIC_ASSISTANT_MIGU_API_PORT:-3004}:6200"
    environment:
      TZ: ${MUSIC_ASSISTANT_TZ:-}
      NODE_ENV: production
      # MA calls it server side; no browser page needs CORS access
      ALLOWED_ORIGINS: http://127.0.0.1
      USE_DATABASE: "false"
      AUTO_STORE_URL: "false"
    volumes:
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
        bind:
          create_host_path: false
    # "/" only redirects to the docs; checking it needs no Migu round trip
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:6200/',{redirect:'manual'}).then(r=>process.exit(r.status<500?0:1),()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
