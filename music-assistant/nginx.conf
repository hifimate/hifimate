map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen __HTTP_BIND__:__HTTP_PORT__;
    # HTTPS for pages that need a secure context (the roomfit microphone).
    # The certificate comes from the HiFi local CA (hifimate/tls.py).
    listen __HTTP_BIND__:__HTTPS_PORT__ ssl;
    ssl_certificate /etc/hifimate-tls/server.crt;
    ssl_certificate_key /etc/hifimate-tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name _;

    location = /spectrum { return 301 "/ctrl/#spectrum"; }
    location = /roomfit { return 301 /ctrl/roomfit/; }
    location = /roomfit/ { return 301 /ctrl/roomfit/; }
    location = /spectrum/ { return 301 "/ctrl/#spectrum"; }
    location = /ctrl { return 301 /ctrl/; }

    location /ctrl/ {
        proxy_pass http://127.0.0.1:5009;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Roomfit recordings (~3 MB per take; hifimate/roomfit.MAX_UPLOAD is
    # 32 MB). nginx's default 1 MB body limit answered 413 before ctrl saw it.
    location /ctrl/api/roomfit/upload/ {
        client_max_body_size 33m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:5009;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /_hifimate/ {
        proxy_pass http://127.0.0.1:5008;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # MA's page (hash routing: only / and /index.html serve it) gets the HiFi
    # spectrum. The audio tap must run before MA's own deferred module scripts
    # so it sees the web player's AudioContext. sub_filter needs an
    # uncompressed upstream, and MA's validators describe its unmodified file:
    # never forward them or let a cached pre-injection copy be revalidated (304).
    location ~ ^/(index\.html)?$ {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_set_header If-None-Match "";
        proxy_set_header If-Modified-Since "";
        proxy_hide_header ETag;
        proxy_hide_header Last-Modified;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        sub_filter '</head>' '<script src="/_hifimate/spectrum-tap.js"></script><link rel="stylesheet" href="/_hifimate/spectrum-overlay.css"><link rel="stylesheet" href="/_hifimate/nowplaying.css"><script type="module" src="/_hifimate/spectrum-overlay.js?embed=ma"></script></head>';
        sub_filter_once on;
    }

    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
