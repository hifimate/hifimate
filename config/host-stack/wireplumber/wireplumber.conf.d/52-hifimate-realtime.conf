# WirePlumber hosts the BlueZ nodes (A2DP decoding): realtime data loop under
# RLIMIT_RTPRIO 5 (scripts/realtime_permissions.py), the priority of
# CamillaDSP and MPD. See pipewire/pipewire.conf.d/52-hifimate-realtime.conf for
# why each argument is needed. WirePlumber loads context.modules itself and
# ignores a module.rt.args section; this second module-rt instance (drop-in
# arrays are appended) replaces the thread utils of the stock one.
context.modules = [
  {
    name = libpipewire-module-rt
    args = {
      rt.prio = 5
      nice.level = 20
      rtkit.enabled = false
      rtportal.enabled = false
    }
    flags = [ ifexists, nofail ]
  }
]
