# Bluetooth speaker: register only the A2DP sink role (receive media audio;
# no HFP/HSP call audio) and route its source nodes to the quarantined HiFi
# input. Their volume belongs to the phone (AVRCP absolute volume) only.
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink ]
}
# The receiver runs headless: the audio user's logind session has no active
# seat ("online"), and seat monitoring would never start the BlueZ monitor,
# so no A2DP endpoint (Audio Sink UUID) would ever be registered.
wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
  }
}
monitor.bluez.rules = [
  {
    matches = [ { node.name = "~bluez_input.*" } ]
    actions = { update-props = {
      bluez5.media-source-role = "playback"
      target.object = "bluetooth_in"
      node.dont-fallback = true
      state.restore-props = false
    } }
  }
]
# Receiver lane volumes belong to their controllers (upmpdcli/DLNA, Music
# Assistant, AirPlay). Never restore/save them in WirePlumber: both MPD
# streams share the media.role=Music key, so one lane's volume would silently
# attenuate the other (e.g. 54% = 0.54^3 = -16 dB). Every new stream starts at
# 0 dB; CamillaDSP's capture stays at unity before the user's main volume.
stream.rules = [
  {
    matches = [
      { node.name = "mpd.HiFi DLNA" }
      { node.name = "mpd.HiFi Music Assistant" }
      { application.process.binary = "shairport-sync" }
      { application.name = "CamillaDSP" }
    ]
    actions = { update-props = {
      state.restore-props = false
    } }
  }
]
