# Native sinks intentionally omit audio.rate so graph changes are negotiated.
context.properties = {
  default.clock.allowed-rates = [ 44100 48000 88200 96000 176400 192000 352800 384000 705600 768000 ]
  default.clock.max-quantum = 32768
  default.clock.quantum-limit = 32768
}
context.objects = [
  { factory = adapter args = {
      factory.name = support.null-audio-sink
      node.name = "airplay_in"
      media.class = Audio/Sink
      audio.position = [ FL FR ]
      node.virtual = true
      monitor.channel-volumes = false
  } }
  { factory = adapter args = {
      factory.name = support.null-audio-sink
      node.name = "dlna_in"
      media.class = Audio/Sink
      audio.position = [ FL FR ]
      node.virtual = true
      monitor.channel-volumes = false
  } }
  { factory = adapter args = {
      factory.name = support.null-audio-sink
      node.name = "music_assistant_dlna_in"
      media.class = Audio/Sink
      audio.position = [ FL FR ]
      node.virtual = true
      monitor.channel-volumes = false
  } }
  { factory = adapter args = {
      factory.name = support.null-audio-sink
      node.name = "bluetooth_in"
      media.class = Audio/Sink
      audio.position = [ FL FR ]
      node.virtual = true
      monitor.channel-volumes = false
  } }
  { factory = adapter args = {
      factory.name = support.null-audio-sink
      node.name = "hifimate_selected"
      media.class = Audio/Sink
      audio.position = [ FL FR ]
      node.virtual = true
