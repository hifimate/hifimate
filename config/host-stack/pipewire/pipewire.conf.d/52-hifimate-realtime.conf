# PipeWire daemon (graph data loop): realtime under the HiFi RLIMIT_RTPRIO of
# 5 (scripts/realtime_permissions.py), the priority of CamillaDSP and MPD (RR
# 5). module-rt asks for 83/88 by default: above the limit it refuses the
# rlimit path ("Priority max (5) must be at least 11") and falls back to
# RTKit, which polkit denies to this headless user (no active seat). Either
# way the data loop silently stayed SCHED_OTHER. With the session bus present
# module-rt prefers RTKit even when the rlimit suffices, so RTKit and the
# portal are off. The stock nice.level -11 exceeds RLIMIT_NICE (0) and that
# failure also disables realtime, so nice is left unchanged (20). rt.time is
# left alone (-1): processes started by hifimate-rt keep their larger
# RLIMIT_RTTIME.
module.rt.args = {
    rt.prio = 5
    nice.level = 20
    rtkit.enabled = false
    rtportal.enabled = false
}
