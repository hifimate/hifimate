// D-Bus and MPRIS on the service user's own session bus: the system bus only
// lets the distribution's shairport-sync user own those names (a warning on every start).
general = { name = @AIRPLAY_NAME@; output_backend = "pa"; dbus_service_bus = "session"; mpris_service_bus = "session"; };
pa = { application_name = @AIRPLAY_NAME@; };

metadata = { enabled = "yes"; include_cover_art = "no"; pipe_name = "@RUNTIME@/airplay.metadata"; };
